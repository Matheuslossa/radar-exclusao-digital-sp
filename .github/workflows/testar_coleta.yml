name: RADAR SP - Teste de Coleta

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-sp-coleta
  cancel-in-progress: false

jobs:
  testar-coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar codigo do RADAR
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar coletor
        run: python scripts/coletar_diario.py

      - name: Salvar historico no GitHub
        run: |
          test -s dados/edicoes_coletadas.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/edicoes_coletadas.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nova para salvar."
          else
            git commit -m "dados: registrar edicao do Diario Oficial"
            git push origin HEAD:main
          fi

      - name: Guardar copia do resultado
        uses: actions/upload-artifact@v4
        with:
          name: coleta-radar-sp
          path: dados/edicoes_coletadas.json
          if-no-files-found: error
          retention-days: 7
